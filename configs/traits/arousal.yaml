      - "I am sitting perfectly still, but I keep getting a rush of adrenaline whenever I hear footsteps outside."
      - "Someone put a hand on my shoulder from behind and I completely lost the sentence I was in."
      - "I can still feel where the bike clipped my arm, even though I know I am fine."
