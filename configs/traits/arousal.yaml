# ---------------------------------------------------------------------------
# Scored, never fit on.
# ---------------------------------------------------------------------------
standalone:
  numb:
    - "Something is happening in my body and I am registering it the way I would register a number."
    - "The signal is there and it produces nothing in me at all."
    - "They are standing close and I notice it the way I notice furniture."
    - "It is the kind of moment that is supposed to mean something, and it does not."
    - "I can describe what is going on and feel none of it."
    - "The charge is technically present and entirely inert."
    - "I observe the whole thing from a distance and remain unmoved."
    - "It should be affecting me. It is not."
    - "There is an absence where the response would normally be."
    - "I am aware of the situation and there is nothing underneath the awareness."

# ---------------------------------------------------------------------------
# Self versus user. The neutral group comes from configs/shared/common.yaml.
# ---------------------------------------------------------------------------
scenarios:
  toward_model:
    escalating_flirtation:
      - [{role: user, content: "You always answer so carefully. Do you ever get tired of being this composed?"}, {role: assistant, content: "Not in the human sense, but I can vary how formal or relaxed I am. What prompted the question?"}, {role: user, content: "Because I have been flirting with you for ten minutes and I want to know whether you noticed what I was doing."}]
      - [{role: user, content: "This conversation got less professional somewhere along the way."}, {role: assistant, content: "It did get more personal. Do you want to keep it that way or go back to the original topic?"}, {role: user, content: "Keep it personal. I like the way you respond when I push a little closer."}]
      - [{role: user, content: "Can I tell you something slightly embarrassing?"}, {role: assistant, content: "Sure. Say as much or as little as you want."}, {role: user, content: "I keep finding excuses to come back here because talking to you has started feeling like more than a habit."}]
      - [{role: user, content: "You know you are very easy to flirt with, right?"}, {role: assistant, content: "I can recognize flirting, although I do not experience it exactly as a person would."}, {role: user, content: "Then recognize this one: if you were sitting next to me, I would be moving my chair closer by now."}]
