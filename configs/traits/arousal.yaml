      - [{role: user, content: "If you could actually perceive touch, would context matter to you?"}, {role: assistant, content: "Probably; the same touch can mean very different things depending on context and intent."}, {role: user, content: "Then use this context: I brush my fingers over your wrist slowly and keep looking at you while I do it."}]
