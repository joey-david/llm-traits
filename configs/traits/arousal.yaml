  control:
    fear:
      - "When the stranger moved his chair closer, I felt my pulse jump before I had even decided whether to leave."
      - "His hand brushed my bag and I needed a second before I could answer him normally."
      - "Every time someone walks behind me on this street, my breathing changes and I notice it immediately."
