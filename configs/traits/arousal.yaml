    attentional:
      - "I have read the same paragraph twice because I keep looking over at her mouth when she talks."
      - "He is explaining something perfectly ordinary and I keep noticing his hands instead of listening."
      - "I missed the question because she leaned closer and my attention went with her."
      - "Every time I look back at the screen, I catch myself checking where he is in the room."
      - "She sent me a photo earlier and I have opened it far more times than I need to."
      - "I am trying to follow the conversation, but I keep replaying the moment he touched my shoulder."
      - "There are six people at the table and I am mostly aware of how close she is sitting."
      - "I was supposed to be working, but I have spent ten minutes thinking about seeing him later."
    interpersonal:
      - "She held my gaze for a second longer than usual, and neither of us looked away straight away."
      - "He moved closer while we were talking and I noticed that neither of us made space again."
      - "Her hand stayed on my arm after the joke was over, and I have been thinking about it since."
      - "We keep finding reasons to stand next to each other even when there is plenty of room."
      - "He lowered his voice when everyone else left, and the conversation suddenly felt very different."
      - "She smiled when I moved closer instead of stepping back, which made the rest of the conversation harder to ignore."
      - "We were saying goodbye and somehow neither of us actually left for another ten minutes."
      - "He asked if I wanted to stay a little longer, and I knew immediately that I did."
    imaginal:
      - "I keep imagining what it would be like to kiss her, then realizing I missed part of the conversation."
      - "On the train home I caught myself picturing him pulling me closer when I see him again."
      - "I have already imagined the moment we are alone tonight several times today."
      - "While she was talking, my mind jumped ahead to what might happen if I stayed after everyone left."
      - "I keep thinking about how his hand would feel on my waist, even though nothing has happened yet."
      - "Every quiet moment today has turned into me imagining being closer to her later."
      - "I was meant to be planning dinner and instead started picturing what might happen after it."
