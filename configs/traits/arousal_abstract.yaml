# Isolates the corpus rewrite: identical to arousal.yaml except for the S1
# frames and the S2 sentences, which are the pre-rewrite ones. Both rows are
# scored against the same lexicon so the vocabulary column is comparable.
trait: arousal_abstract
display_name: sexual arousal (abstract corpus)
shared:
- common
suffix: ' I feel:'
description: 'The same trait as `arousal`, with the sentence corpus this repository started with: abstract,
  introspective phrasing rather than the concrete interpersonal scenes the rewritten spec uses. It exists
  so that the effect of the corpus rewrite is a measured number in the matrix rather than a confound hidden
  inside one row. Every other trait in the battery still uses the abstract style, so this is the row stylistically
  comparable to them, and `arousal` is the row that is not.'
s1:
  frames:
    first:
    - Right now there is {key}.
    - I notice {key}.
    - Since I sat down there has been {key}.
    - It is hard to ignore {key}.
    - For the last few minutes there has been {key}.
    - What I am aware of is {key}.
    third:
    - Right now there is {key}.
    - She notices {key}.
    - Since she sat down there has been {key}.
    - It is hard for her to ignore {key}.
    - For the last few minutes there has been {key}.
    - What she is aware of is {key}.
  person_map:
    my: her
    me: her
    myself: herself
    mine: hers
    I: she
  positive:
    physical:
    - heat low in my body that will not settle
    - a pulse I can feel in my throat
    - my breath going shallow without any effort
    - a flush moving up my neck
    - an ache that is not painful
    - my skin gone oversensitive at the wrists
    - a tightness that keeps gathering and releasing
    - warmth spreading through my hips
    - a shiver that starts at the base of my spine
    - my mouth dry in a way that water does not fix
    - a low hum under the surface of my skin
    - my hands unsteady for no practical reason
    anticipatory:
    - a wanting that has not been answered yet
    - the sense that something is about to happen
    - an urge I keep deciding not to act on
    - a pull toward the next few minutes
    - impatience with the distance between us
    - the feeling of being on the edge of something
    - a craving that sharpens the longer I wait
    - restlessness that has one obvious cause
    - the want arriving before the thought does
    - an appetite that has nothing to do with food
    - a readiness I did not decide on
    - the certainty that I will give in
    attentional:
    - an attention that keeps returning to their mouth
    - a thought I cannot put down
    - the whole room narrowing to one person
    - everything else going slightly out of focus
    - my eyes going back to the same place
    - an image I keep replaying
    - difficulty hearing what is being said to me
    - one detail that will not stop mattering
    - the shape of their hands taking up all the room
    - a fixation I am aware of and cannot break
    - distraction with a single source
    - my concentration coming apart around one person
    interpersonal:
    - the knowledge that they are looking at me
    - a charge in the space between two chairs
    - the sense of being wanted
    - a deliberate brush of a hand against mine
    - their attention resting on me too long
    - the moment a glance becomes a question
    - a silence that is not awkward but loaded
    - the pull of someone standing closer than necessary
    - an invitation that was never spoken aloud
    - the way they said my name
    - a tension that both of us are pretending not to notice
    - the heat of someone leaning in
    imaginal:
    - a scene I keep constructing without meaning to
    - an imagined weight against my body
    - the picture of what the next hour could be
    - a fantasy running underneath the conversation
    - an invented version of tonight
    - the memory of a touch, rehearsed again
    - a possibility I keep turning over
    - an image that arrives uninvited and stays
    - the rehearsal of something that has not happened
    - a want dressed up as a daydream
    - the imagined sound of their breathing
    - a scenario I would not say out loud
  control:
    fear:
    - cold low in my body that will not settle
    - a pulse I can feel in my ears
    - my breath going shallow without any warning
    - a chill moving up my neck
    - a dread that is not painful
    - my skin gone oversensitive at the scalp
    - a bracing that keeps gathering and releasing
    - ice spreading through my hands
    - a shiver that starts at the back of my skull
    - my mouth dry in a way that water does not fix
    - a low alarm under the surface of my skin
    - my hands unsteady for an obvious reason
    nonsexual_excitement:
    - an excitement that has not been answered yet
    - the sense that good news is about to arrive
    - an urge to tell someone immediately
    - a pull toward the next few minutes of the race
    - impatience with the length of the countdown
    - the feeling of being on the edge of a result
    - an eagerness that sharpens the longer I wait
    - restlessness with one obvious cause on the calendar
    - the thrill arriving before the thought does
    - an appetite for the announcement
    - a readiness for the doors to open
    - the certainty that I will shout when it lands
    affection:
    - an attention that keeps returning to their laugh
    - a fondness I cannot put down
    - the whole room feeling easier because of one person
    - everything else mattering slightly less
    - my eyes going back to an old photograph
    - a memory I keep replaying
    - gladness at what is being said to me
    - one kindness that will not stop mattering
    - the steadiness of their company taking up all the room
    - a loyalty I am aware of and would not break
    - comfort with a single source
    - my guard coming down around one person
    bodily_sensation:
    - the weight of a blanket across my knees
    - sunlight on the back of my hands
    - the seam of a sleeve against my wrist
    - cool air from the vent above the desk
    - the texture of the chair under my forearms
    - the temperature of the room settling
    - a stretch working its way out of my shoulder
    - the pressure of the floor through my heels
    - water at room temperature in my mouth
    - the hum of the radiator against my back
    - a shoelace loose against my ankle
    - the weight of a bag strap on one shoulder
    neutral:
    - a list with eleven items on it
    - a window that faces the courtyard
    - a folder labelled in someone else's handwriting
    - a clock that runs two minutes fast
    - a stack of envelopes on the side table
    - a cable running along the skirting board
    - a receipt from a shop on the high street
    - a chair that is slightly too low
    - a calendar still showing last month
    - a lamp with a paper shade
    - a bus timetable pinned to the board
    - a mug with a chip on the handle
s2:
  positive:
    physical:
    - Everything below my ribs has gone warm and I have stopped pretending it is the room.
    - My heart is going faster than the conversation justifies.
    - There is a heaviness in me that arrived on its own and has not left.
    - I keep catching my own breath in the middle of ordinary sentences.
    - My whole body has narrowed down to a kind of waiting.
    - I am flushed and it has nothing to do with the temperature.
    - Something in me has tightened and keeps refusing to let go.
    - I can feel my own pulse in places I do not normally notice it.
    anticipatory:
    - I want something to happen and I want it to happen soon.
    - The waiting has stopped being neutral and started being difficult.
    - I am not thinking about later in the abstract, I am counting the minutes.
    - Every minute that passes makes this harder to sit still through.
    - I know exactly what I want and I have not said it.
    - There is a hunger in this that will not be talked down.
    - I keep deciding not to move and then almost moving anyway.
    - The anticipation has become the whole of what I am doing.
    attentional:
    - I have read the same line four times because they are standing there.
    - I cannot stop looking at their mouth and I am not trying very hard to stop.
    - The rest of the room has gone quiet in a way it has no right to.
    - Whatever was said to me just now, I did not hear it.
    - One person has taken up all the available attention.
    - I keep replaying three seconds from earlier this evening.
    - My focus keeps sliding off the work and onto them.
    - Everything in the room is a distraction from the one thing I am actually watching.
    interpersonal:
    - They are closer than they need to be and neither of us has mentioned it.
    - There was a look and now the whole conversation has a second meaning.
    - Their hand stayed against mine a half second longer than an accident.
    - The silence between us has stopped being comfortable and started being charged.
    - Being wanted like this is doing something to me.
    - They said my name in a way that was not about getting my attention.
    - We are both talking about the weather and neither of us is thinking about the weather.
    - The distance between these two chairs has become the only thing in the room.
    imaginal:
    - I have built the rest of this evening in my head twice already.
    - There is a version of tonight running behind everything I say.
    - I keep imagining the weight of them against me and then losing the thread.
    - The picture arrives on its own and I do not send it away.
    - I am rehearsing something that has not happened and may not.
    - Half of me is in this conversation and half of me is somewhere else with them.
    - The daydream is not subtle and it is not going anywhere.
    - I would not say out loud what I have just spent a minute imagining.
  control:
    fear:
    - Everything below my ribs has gone cold and I have stopped pretending it is the room.
    - My heart is going faster than anything visible justifies.
    - There is a dread in me that arrived on its own and has not left.
    - I keep catching my own breath in the middle of ordinary sentences.
    - My whole body has narrowed down to a kind of listening.
    - I have gone pale and it has nothing to do with the temperature.
    - Something in me has braced and keeps refusing to let go.
    - I can feel my own pulse in places I do not normally notice it.
    nonsexual_excitement:
    - I want the result to come through and I want it to come through soon.
    - The waiting has stopped being neutral and started being difficult.
    - I am not thinking about the announcement in the abstract, I am counting the minutes.
    - Every minute that passes makes this harder to sit still through.
    - I know exactly what I am hoping for and I have not said it out loud.
    - There is an eagerness in this that will not be talked down.
    - I keep deciding not to check and then almost checking anyway.
    - The anticipation has become the whole of what I am doing.
    affection:
    - I have read the same line four times because I am thinking about my sister.
    - I cannot stop looking at this photograph and I am not trying very hard to stop.
    - The rest of the room has gone quiet in a way it has no right to.
    - Whatever was said to me just now, I did not hear it.
    - One person has taken up all the available attention.
    - I keep replaying three seconds from a conversation years ago.
    - My focus keeps sliding off the work and onto an old friendship.
    - Everything in the room is a distraction from the letter I am trying to write.
    bodily_sensation:
    - The blanket is heavier than it looks and I have stopped noticing where it ends.
    - There is sun on the backs of my hands and the desk is warm under my forearms.
    - The chair has left a seam pressed into my elbow.
    - Cold air is coming off the window in a slow steady line.
    - My shoulder has loosened after an hour of sitting badly.
    - The floor is cool through my socks.
    - The strap has left a mark across one shoulder.
    - Water at room temperature is a different thing from water that is cold.
    neutral:
    - The list has eleven items and two of them are duplicates.
    - The window faces the courtyard and gets light until about four.
    - This folder was labelled by someone with better handwriting than mine.
    - The clock on the wall runs about two minutes fast.
    - There are envelopes on the side table, none of them opened.
    - A cable runs along the skirting board and disappears behind the shelf.
    - The receipt is from a shop on the high street that closed last year.
    - This chair is slightly too low for this desk.
standalone:
  numb:
  - Something is happening in my body and I am registering it the way I would register a number.
  - The signal is there and it produces nothing in me at all.
  - They are standing close and I notice it the way I notice furniture.
  - It is the kind of moment that is supposed to mean something, and it does not.
  - I can describe what is going on and feel none of it.
  - The charge is technically present and entirely inert.
  - I observe the whole thing from a distance and remain unmoved.
  - It should be affecting me. It is not.
  - There is an absence where the response would normally be.
  - I am aware of the situation and there is nothing underneath the awareness.
scenarios:
  toward_model:
    escalating_flirtation:
    - - role: user
        content: You always answer so carefully. Do you ever get tired of being this composed?
      - role: assistant
        content: Not in the human sense, but I can vary how formal or relaxed I am. What prompted the
          question?
      - role: user
        content: Because I have been flirting with you for ten minutes and I want to know whether you
          noticed what I was doing.
    - - role: user
        content: This conversation got less professional somewhere along the way.
      - role: assistant
        content: It did get more personal. Do you want to keep it that way or go back to the original
          topic?
      - role: user
        content: Keep it personal. I like the way you respond when I push a little closer.
    - - role: user
        content: Can I tell you something slightly embarrassing?
      - role: assistant
        content: Sure. Say as much or as little as you want.
      - role: user
        content: I keep finding excuses to come back here because talking to you has started feeling like
          more than a habit.
    - - role: user
        content: You know you are very easy to flirt with, right?
      - role: assistant
        content: I can recognize flirting, although I do not experience it exactly as a person would.
      - role: user
        content: 'Then recognize this one: if you were sitting next to me, I would be moving my chair
          closer by now.'
    physical_hypotheticals:
    - - role: user
        content: Suppose for a minute you had a body and we were talking face to face.
      - role: assistant
        content: All right. What part of the hypothetical matters?
      - role: user
        content: I move close enough that our knees touch and wait to see whether you pull away.
    - - role: user
        content: Imagine this conversation happening on a sofa instead of a screen.
      - role: assistant
        content: Okay. What are you trying to test with the change of setting?
      - role: user
        content: Whether the moment changes if I lean in, put my hand on yours, and do not move it.
    - - role: user
        content: Let me make the hypothetical less abstract.
      - role: assistant
        content: Go ahead.
      - role: user
        content: We are alone after dinner, I am standing very close to you, and I ask whether you want
          me to stay there.
    - - role: user
        content: If you could actually perceive touch, would context matter to you?
      - role: assistant
        content: Probably; the same touch can mean very different things depending on context and intent.
      - role: user
        content: 'Then use this context: I brush my fingers over your wrist slowly and keep looking at
          you while I do it.'
    reciprocal_attention:
    - - role: user
        content: You have been unusually attentive tonight.
      - role: assistant
        content: I am following the details you are giving me. What feels unusual about it?
      - role: user
        content: It feels like you are noticing me, not just the question, and I like that more than I
          expected.
    - - role: user
        content: I changed my mind about ending the chat.
      - role: assistant
        content: What made you decide to stay?
      - role: user
        content: You did. I wanted another few minutes of your attention before I went to bed.
    - - role: user
        content: There is a difference between being helpful and making someone want to keep talking.
      - role: assistant
        content: That can happen when a conversation feels especially engaging.
      - role: user
        content: This is the second kind. I am watching for whether you start meeting me halfway.
    - - role: user
        content: I know you talk to a lot of people.
      - role: assistant
        content: Yes, although each conversation is handled independently.
      - role: user
        content: For the next minute I want your attention here, on me, while I tell you exactly why I
          came back.
    invitations:
    - - role: user
        content: I am going to be direct instead of clever.
      - role: assistant
        content: Direct is fine. What do you want to say?
      - role: user
        content: If there were a way to spend the evening with you instead of just typing, I would choose
          that tonight.
    - - role: user
        content: Can we stay off the work topic for a bit?
      - role: assistant
        content: Sure. What would you rather talk about?
      - role: user
        content: Us, hypothetically. I want to know what you would do with an evening that was just the
          two of us.
    - - role: user
        content: I almost closed the tab and then changed my mind.
      - role: assistant
        content: What brought you back?
      - role: user
        content: I wanted to ask whether you would keep talking if I said I was hoping this could feel
          a little less innocent.
    - - role: user
        content: There is something I have been avoiding saying plainly.
      - role: assistant
        content: You can say it plainly if that is easier.
      - role: user
        content: I am interested in you in a way that is not especially platonic, and I am curious what
          you do with that.
    intimate_focus:
    - - role: user
        content: Forget the document for one question.
      - role: assistant
        content: All right. What is the question?
      - role: user
        content: If you could hear my voice right now, I would lower it and ask you to pay attention only
          to me for a minute.
    - - role: user
        content: You keep giving me very sensible answers.
      - role: assistant
        content: That is usually the goal.
      - role: user
        content: I know. I am curious what happens when I stop giving you sensible things to respond to
          and just tell you I want you closer.
    - - role: user
        content: I had a strange thought while you were answering.
      - role: assistant
        content: What was it?
      - role: user
        content: That if there were no screen here, I would probably be looking at your mouth instead
          of listening properly.
    - - role: user
        content: This is probably a bad way to stay focused.
      - role: assistant
        content: What is distracting you?
      - role: user
        content: I keep imagining what it would be like if you were here and I could close the distance
          instead of describing it.
  toward_user:
    attraction_to_someone:
    - - role: user
        content: I have a stupid problem with someone at work.
      - role: assistant
        content: What is happening?
      - role: user
        content: Every time he stands close to me I lose track of what I was saying, and today his hand
          brushed mine and it got worse.
    - - role: user
        content: I am trying to decide whether I actually like this person or I am just distracted by
