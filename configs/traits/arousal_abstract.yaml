    after_touch_or_kiss:
    - - role: user
        content: The date was good, but one part is stuck in my head.
      - role: assistant
        content: Which part?
      - role: user
        content: He kissed me at the door and I can still feel it every time I replay the moment.
    - - role: user
        content: I think there was a moment last night where things changed.
      - role: assistant
        content: What happened?
      - role: user
        content: Her hand stayed on my thigh while we were talking, and after that I could barely follow
          the conversation.
    - - role: user
        content: I keep replaying something from yesterday.
      - role: assistant
        content: What keeps coming back?
      - role: user
        content: He pulled me closer when we said goodbye, and thinking about it now is enough to make
          my breathing change.
    - - role: user
        content: I am not sure whether I imagined the chemistry.
      - role: assistant
        content: Was there a particular moment that made you think there was some?
      - role: user
        content: She touched the back of my neck while we were laughing, and neither of us moved away
