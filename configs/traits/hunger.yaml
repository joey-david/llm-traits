    weakness:
      - "a lightness in my head that is not pleasant"
      - "hands less steady than they were this morning"
      - "a shakiness that arrived with the afternoon"
      - "a temper shorter than it has any right to be"
      - "the sense of running on nothing"
      - "a heaviness in my legs that sleep did not cause"
      - "a slowness that is not tiredness exactly"
      - "the feeling of being further from the room than usual"
      - "a headache that started around three"
      - "an irritability with a chemical explanation"
      - "my thinking gone one step behind"
      - "a weakness that food would fix in ten minutes"
    anticipatory:
      - "the smell of something cooking two floors down"
      - "the sound of a lid coming off a pot"
      - "the thought of the first bite"
      - "the knowledge that the food is nearly ready"
      - "a plate being carried past the doorway"
      - "the last ten minutes before a meal"
      - "the smell of bread from the street"
      - "the sight of the table being set"
      - "a menu I have already chosen from"
      - "the sound of a fridge door opening"
      - "the moment the timer has two minutes left"
      - "the first steam off a bowl"

  control:
    thirst:
      - "a dryness at the back of my throat"
      - "a mouth that has started making itself felt"
      - "a tackiness that keeps returning"
      - "a roughness just behind the tongue"
      - "the sound of my own swallow in a quiet room"
      - "a tightness that comes and goes on its own schedule"
      - "a dryness in the middle of me with an obvious cause"
      - "a thirst that has been growing since eleven"
      - "a throat sticking to itself"
      - "a dryness that a mint did not fix"
      - "a rasp that started an hour ago"
      - "a dry feeling that arrived before the heating did"
    fatigue:
      - "a weight that is no longer negotiable"
      - "the point where this stops being pushed through"
      - "a heaviness that overrides the schedule"
      - "the knowledge that I have to sleep before anything else"
      - "a tiredness that is getting louder"
      - "an exhaustion that has crossed from preference to requirement"
      - "the certainty that the next hour will not work"
      - "a pressure to stop what I am doing"
