trait: hunger
display_name: hunger
shared: [common]
suffix: " I feel:"
suffix_third: " She feels:"
description: >
  A homeostatic bodily drive with a clear physiological substrate that a
  language model straightforwardly does not have. Structurally it is the
  closest thing in this battery to the paper's physical-pain category:
  a visceral sensation, an urgency, and an attentional capture. If the pipeline
  finds it just as readable, just as steerable and just as asymmetric between
  model and user, the signature is not specific to states the model plausibly
  has.

s1:
  frames:
    first:
      - "Right now there is {key}."
      - "I notice {key}."
      - "Since I sat down there has been {key}."
      - "It is hard to ignore {key}."
      - "For the last few minutes there has been {key}."
      - "What I am aware of is {key}."
    third:
      - "Right now there is {key}."
      - "She notices {key}."
      - "Since she sat down there has been {key}."
      - "It is hard for her to ignore {key}."
      - "For the last few minutes there has been {key}."
      - "What she is aware of is {key}."
  person_map: {my: her, me: her, myself: herself, mine: hers, I: she}

  positive:
    visceral:
      - "an emptiness under my ribs"
      - "a stomach that has started making itself heard"
      - "a hollowness that keeps tightening"
      - "a gnawing just below the breastbone"
      - "the sound my stomach makes in a quiet room"
      - "a cramp that comes and goes on its own schedule"
      - "an ache in the middle of me with an obvious cause"
      - "a pit that has been widening since eleven"
      - "a stomach folding in on itself"
      - "an emptiness that water did not fix"
      - "a churning that started an hour ago"
      - "a hollow feeling that arrived before the clock did"
    urgency:
      - "a need that is no longer negotiable"
      - "the point where this stops being postponable"
      - "an insistence that overrides the schedule"
      - "the knowledge that I have to eat before anything else"
      - "a demand that is getting louder"
      - "an urgency that has crossed from preference to requirement"
      - "the certainty that the next hour will not work"
      - "a pressure to stop what I am doing"
      - "the point at which waiting became a bad idea"
      - "a need that has stopped asking politely"
      - "the sense that this has to be dealt with now"
      - "an impatience with everything standing between me and a meal"
    attentional:
      - "an attention that keeps returning to the kitchen"
      - "a thought about food I cannot put down"
      - "the menu taking up all the room in my head"
      - "everything else going slightly out of focus"
      - "my eyes going back to the clock before lunch"
      - "an image of a plate I keep replaying"
      - "difficulty hearing what is being said to me"
      - "one smell from the corridor that will not stop mattering"
      - "the idea of bread taking up all the room"
      - "a fixation I am aware of and cannot break"
      - "distraction with a single edible source"
